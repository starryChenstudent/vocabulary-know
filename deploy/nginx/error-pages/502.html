<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary iknow · 维护中</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #f6f3ec;
        color: #1f1a14;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 32px 28px;
        text-align: center;
        background: #fffcf8;
        border: 1px solid #e4ddd1;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(31, 26, 20, 0.08);
      }
      h1 {
        font-size: 1.35rem;
        margin-bottom: 12px;
        color: #0f766e;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #6b6459;
      }
      .hint {
        margin-top: 20px;
        font-size: 0.85rem;
        color: #9c9488;
      }
      button {
        margin-top: 24px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: #0f766e;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:hover {
        background: #0d5f58;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Vocabulary iknow</h1>
      <p>网站正在更新或短暂重启，请稍候片刻后刷新页面。</p>
      <p class="hint">通常 30 秒内即可恢复。若长时间无法访问，请联系管理员。</p>
      <button type="button" onclick="location.reload()">刷新页面</button>
    </div>
  </body>
</html>
